name: Mirror original DORO
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update upstream snapshot
        run: |
          git fetch https://github.com/9Rei/DORO.git refs/heads/main
          git push origin FETCH_HEAD:refs/heads/original
